version: 2

updates:
  - package-ecosystem: gomod
    directory: /bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /ha-cards
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /integration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Home Assistant installs these platform requirements dynamically and the
    # real-HA harness must use the exact versions from its camera/stream manifests.
    ignore:
      - dependency-name: PyTurboJPEG
      - dependency-name: av

  - package-ecosystem: docker
    directory: /bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      container-images-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
