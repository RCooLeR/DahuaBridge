name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race smoke
        run: CGO_ENABLED=1 go test -race ./internal/app ./internal/config ./internal/ha ./internal/metrics ./internal/store ./internal/streams

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ./bridge
          file: ./bridge/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: dahuabridge:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_id }}

      - name: Smoke test container
        run: |
          cat > /tmp/dahuabridge-config.yaml <<'YAML'
          log:
            level: error
          http:
            listen_address: ":9020"
          state_store:
            enabled: false
          devices:
            ipc:
              - id: smoke_ipc
                name: Smoke IPC
                base_url: http://127.0.0.1:1
                username: smoke
                password: smoke
                request_timeout: 100ms
                poll_interval: 1h
          YAML
          docker run -d --name dahuabridge-ci -p 9020:9020 -v /tmp/dahuabridge-config.yaml:/config/config.yaml:ro dahuabridge:ci
          trap 'docker logs dahuabridge-ci || true; docker rm -f dahuabridge-ci || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9020/healthz; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' dahuabridge-ci)" != "true" ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

  integration:
    name: Home Assistant Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile integration
        run: python -m compileall integration/custom_components/dahuabridge

      - name: Test
        run: python -m unittest discover -s integration/tests

  ha-cards:
    name: HA Cards Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ha-cards

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ha-cards/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
