name: CI

"on":
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge Go Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:9.7.2@sha256:e2bde46db6563855d7177adb5f0b57b9dc663f5a20927a90f4259d3312068497
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: dahuabridge_ci
          MYSQL_USER: dahuabridge_ci
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    env:
      DAHUABRIDGE_TEST_MYSQL_DSN: dahuabridge_ci:ci-password@tcp(127.0.0.1:3306)/dahuabridge_ci?tls=skip-verify

    defaults:
      run:
        working-directory: bridge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Require TLS for MySQL integration tests
        working-directory: .
        run: |
          docker exec -e MYSQL_PWD=ci-root-password "${{ job.services.mysql.id }}" \
            mysql --user=root \
            -e "ALTER USER 'dahuabridge_ci'@'%' REQUIRE SSL"
          docker exec -e MYSQL_PWD=ci-password "${{ job.services.mysql.id }}" \
            mysql --host=127.0.0.1 --user=dahuabridge_ci --ssl-mode=REQUIRED -e "SELECT 1"
          if docker exec -e MYSQL_PWD=ci-password "${{ job.services.mysql.id }}" \
            mysql --host=127.0.0.1 --user=dahuabridge_ci --ssl-mode=DISABLED -e "SELECT 1"; then
            echo "MySQL application user unexpectedly accepted plaintext authentication" >&2
            exit 1
          fi

      - name: Set up Node for embedded browser tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install FFmpeg for media integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race smoke
        run: CGO_ENABLED=1 go test -race ./internal/app ./internal/archive ./internal/config ./internal/dahua/... ./internal/ha ./internal/httpserver ./internal/media ./internal/metrics ./internal/rtsprelay ./internal/store ./internal/streams

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./bridge
          file: ./bridge/Dockerfile
          call: check
          pull: true

      - name: Read build date
        id: build-metadata
        run: echo "build-date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./bridge
          file: ./bridge/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: dahuabridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-metadata.outputs.build-date }}

      - name: Smoke test container
        run: |
          docker run --rm dahuabridge:ci --help >/dev/null
          cat > /tmp/dahuabridge-config.yaml <<'YAML'
          log:
            level: error
          http:
            listen_address: ":9020"
          state_store:
            enabled: false
          devices:
            ipc:
              - id: smoke_ipc
                name: Smoke IPC
                base_url: http://127.0.0.1:1
                username: smoke
                password: smoke
                request_timeout: 100ms
                poll_interval: 1h
          YAML
          # tini needs KILL to forward signals after the bridge drops its root UID.
          docker run -d --name dahuabridge-ci --init --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --cap-drop ALL --cap-add SETGID --cap-add SETUID --cap-add KILL \
            --security-opt no-new-privileges \
            -p 127.0.0.1:9020:9020 \
            -v /tmp/dahuabridge-config.yaml:/config/config.yaml:ro \
            dahuabridge:ci
          trap 'docker logs dahuabridge-ci || true; docker rm -f dahuabridge-ci || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9020/healthz; then
              docker stop --timeout 10 dahuabridge-ci
              test "$(docker inspect -f '{{.State.ExitCode}}' dahuabridge-ci)" = "0"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' dahuabridge-ci)" != "true" ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

  integration:
    name: Home Assistant Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage integration for hassfest
        run: cp -a integration/custom_components custom_components

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master 2026-08-28

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Validate integration metadata
        run: |
          python -m json.tool integration/custom_components/dahuabridge/manifest.json >/dev/null
          for translation in integration/custom_components/dahuabridge/translations/*.json; do
            python -m json.tool "$translation" >/dev/null
          done

      - name: Compile integration
        run: python -m compileall integration/custom_components/dahuabridge

      - name: Test
        run: python -m unittest discover -s integration/tests

  integration-real-ha:
    name: Real Home Assistant Lifecycle Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: integration/requirements-test-ha.txt
      - name: Install real HA test dependencies
        run: python -m pip install -r integration/requirements-test-ha.txt
      - name: Exercise real integration setup, options and unload
        run: python -m pytest -c integration/pytest-ha.ini integration/tests_real_ha

  ha-cards:
    name: HA Cards Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.22.2"
          - "24"
          - "26"

    defaults:
      run:
        working-directory: ha-cards

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm
          cache-dependency-path: ha-cards/package-lock.json

      - name: Use pinned npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm12" npm@12.2.0
          echo "$RUNNER_TEMP/npm12/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          test "$(npm --version)" = "12.2.0"
          npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Browser smoke
        if: matrix.node-version == '24'
        run: npm run test:browser -- "$(command -v google-chrome)"
