name: dahuabridge

services:
  dahuabridge:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    container_name: dahuabridge
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      # The init process forwards signals after the bridge drops its root UID.
      - KILL
    security_opt:
      - no-new-privileges:true
    ports:
      - "9020:9020"
    environment:
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - type: bind
        source: ./config.yaml
        target: /config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    # Optional if you want Intel iGPU acceleration through QSV/VAAPI.
    # The entrypoint passes every /dev/dri device GID to the unprivileged
    # dahuabridge process without modifying the read-only root filesystem.
    # devices:
    #   - /dev/dri:/dev/dri
