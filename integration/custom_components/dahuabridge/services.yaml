start_recording:
  target:
    entity:
      integration: dahuabridge
      domain: camera
  fields:
    profile:
      selector:
        text:
      required: false
    duration_seconds:
      selector:
        number:
          min: 1
          max: 86400
          mode: box
      required: false

stop_recording:
  target:
    entity:
      integration: dahuabridge
      domain: camera

set_native_playback_source:
  target:
    entity:
      integration: dahuabridge
      domain: camera
  fields:
    stream_source:
      selector:
        text:
      required: true

clear_native_playback_source:
  target:
    entity:
      integration: dahuabridge
      domain: camera

set_live_source:
  name: Set live source
  description: Use the integration default or prefer the recorder or camera for live video, with automatic fallback to the other source. Recorded playback stays on the recorder.
  target:
    entity:
      integration: dahuabridge
      domain: camera
  fields:
    source:
      name: Preferred live source
      required: true
      selector:
        select:
          options:
            - label: Use integration default
              value: default
            - label: NVR
              value: nvr
            - label: Camera
              value: camera
