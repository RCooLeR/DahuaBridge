start_recording:
  target:
    entity:
      integration: dahuabridge
      domain: camera
  fields:
    profile:
      selector:
        text:
      required: false
    duration_seconds:
      selector:
        number:
          min: 1
          max: 86400
          mode: box
      required: false

stop_recording:
  target:
    entity:
      integration: dahuabridge
      domain: camera

set_native_playback_source:
  target:
    entity:
      integration: dahuabridge
      domain: camera
  fields:
    stream_source:
      selector:
        text:
      required: true

clear_native_playback_source:
  target:
    entity:
      integration: dahuabridge
      domain: camera
